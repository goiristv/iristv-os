<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="iris-br-bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1B2238"/>
      <stop offset="60%" stop-color="#0E1220"/>
      <stop offset="100%" stop-color="#07090F"/>
    </radialGradient>
    
    <linearGradient id="iris-ring-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <linearGradient id="iris-ring-2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF00A0"/>
      <stop offset="50%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>

    <radialGradient id="iris-core" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E0F7FF"/>
      <stop offset="70%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </radialGradient>

    <filter id="iris-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="192" height="192" rx="42" fill="url(#iris-br-bg)"/>
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Ambient Outer Glow -->
  <circle cx="96" cy="96" r="54" fill="none" stroke="url(#iris-ring-1)" stroke-width="6" opacity="0.35" filter="url(#iris-glow)"/>

  <!-- Outer Orbital Aperture (Iris Vortex) -->
  <g transform="rotate(-25 96 96)">
    <!-- Arc 1 -->
    <path d="M96 34 A62 62 0 0 1 158 96" fill="none" stroke="url(#iris-ring-1)" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Arc 2 -->
    <path d="M158 96 A62 62 0 0 1 96 158" fill="none" stroke="url(#iris-ring-2)" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Arc 3 -->
    <path d="M96 158 A62 62 0 0 1 34 96" fill="none" stroke="url(#iris-ring-1)" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Arc 4 -->
    <path d="M34 96 A62 62 0 0 1 96 34" fill="none" stroke="url(#iris-ring-2)" stroke-width="7.5" stroke-linecap="round"/>
  </g>

  <!-- Inner Dynamic Ring (Opposite Rotation) -->
  <g transform="rotate(35 96 96)">
    <circle cx="96" cy="96" r="44" fill="none" stroke="url(#iris-ring-2)" stroke-width="4.5" stroke-dasharray="24 16" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Cybernetic Orbit Latitude Rings -->
  <ellipse cx="96" cy="96" rx="48" ry="18" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" transform="rotate(-20 96 96)"/>
  <ellipse cx="96" cy="96" rx="48" ry="18" fill="none" stroke="rgba(255, 0, 160, 0.35)" stroke-width="2" transform="rotate(40 96 96)"/>

  <!-- Central Luminous Iris Eye / Web Core -->
  <circle cx="96" cy="96" r="24" fill="url(#iris-core)" filter="url(#core-glow)"/>
  
  <!-- Holographic Pupil Specular -->
  <circle cx="89" cy="89" r="6" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="106" cy="104" r="2.5" fill="#FFFFFF" opacity="0.6"/>

  <!-- Orbital Navigation Satellites -->
  <circle cx="148" cy="72" r="4" fill="#00FFCC" filter="url(#core-glow)"/>
  <circle cx="44" cy="120" r="3.5" fill="#FF00A0" filter="url(#core-glow)"/>
</svg>