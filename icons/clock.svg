<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="clk-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2330"/>
      <stop offset="100%" stop-color="#0B0D13"/>
    </linearGradient>
    <linearGradient id="clk-dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7ECF5"/>
    </linearGradient>
    <filter id="clk-sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#clk-bg)"/>
  <circle cx="96" cy="96" r="68" fill="url(#clk-dial)" filter="url(#clk-sh)"/>
  <!-- Hour ticks -->
  <g stroke="#1A1F2B" stroke-width="4" stroke-linecap="round">
    <line x1="96" y1="36" x2="96" y2="44"/>
    <line x1="96" y1="148" x2="96" y2="156"/>
    <line x1="36" y1="96" x2="44" y2="96"/>
    <line x1="148" y1="96" x2="156" y2="96"/>
  </g>
  <!-- Hands -->
  <line x1="96" y1="96" x2="96" y2="56" stroke="#11151E" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="96" y1="96" x2="132" y2="112" stroke="#11151E" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="88" y1="104" x2="134" y2="62" stroke="#FF9500" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="96" cy="96" r="5" fill="#FF9500"/>
</svg>
