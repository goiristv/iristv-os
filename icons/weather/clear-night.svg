<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BFDBFE" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#60A5FA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonCore" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="75%" stop-color="#BFDBFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="moonShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#1E3A8A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="68" cy="62" r="54" fill="url(#moonGlow)"/>

  <!-- Twinkling Diamond Stars -->
  <path d="M98 26 L100 32 L106 34 L100 36 L98 42 L96 36 L90 34 L96 32 Z" fill="#F8FAFC" opacity="0.95"/>
  <path d="M28 38 L29.5 42 L34 43.5 L29.5 45 L28 49.5 L26.5 45 L22 43.5 L26.5 42 Z" fill="#E2E8F0" opacity="0.85"/>
  <circle cx="102" cy="74" r="2.8" fill="#BAE6FD" opacity="0.9"/>
  <circle cx="26" cy="84" r="2.2" fill="#E0F2FE" opacity="0.75"/>

  <!-- Cute 3D Curved Crescent Moon -->
  <g filter="url(#moonShadow)">
    <path d="M74 24 
             C50 24 30 44 30 68 
             C30 92 50 112 74 112 
             C85 112 95 108 103 100 
             C80 97 60 76 60 52 
             C60 41 64 30 71 22 
             C72 22.7 73 23.3 74 24 Z" 
          fill="url(#moonCore)"/>
    
    <!-- Moon Crater Indents -->
    <circle cx="48" cy="64" r="5.5" fill="#93C5FD" opacity="0.45"/>
    <circle cx="58" cy="85" r="3.8" fill="#93C5FD" opacity="0.38"/>
    <circle cx="46" cy="80" r="2.8" fill="#93C5FD" opacity="0.35"/>

    <!-- Crescent Specular Rim -->
    <path d="M72 26 C52 28 34 46 34 68 C34 88 48 105 68 110" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.85"/>
  </g>
</svg>
