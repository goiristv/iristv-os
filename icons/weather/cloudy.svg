<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Back Cloud Gradients -->
    <linearGradient id="backCloud" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Front Cloud Gradients -->
    <linearGradient id="cloudBody" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="82%" stop-color="#D9E6F7"/>
      <stop offset="100%" stop-color="#BACFE6"/>
    </linearGradient>
    <linearGradient id="cloudHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="backCloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="cloudShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F2444" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F2444" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Back Secondary Puffy Cloud -->
  <g filter="url(#backCloudShadow)">
    <path d="M50 72 
             L96 72 
             A16 16 0 0 0 98 40 
             A20 20 0 0 0 64 34 
             A18 18 0 0 0 40 54 
             A15 15 0 0 0 50 72 Z" 
          fill="url(#backCloud)"/>
    <path d="M42 52 A16 16 0 0 1 64 36 A18 18 0 0 1 96 42" 
          stroke="#E2E8F0" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.65"/>
  </g>

  <!-- Front Primary Marshmallow Cloud -->
  <g filter="url(#cloudShadow)">
    <path d="M36 98 
             L92 98 
             A18 18 0 0 0 95 62.3 
             A24 24 0 0 0 54 53.5 
             A20 20 0 0 0 24 78 
             A18 18 0 0 0 36 98 Z" 
          fill="url(#cloudBody)"/>
    <path d="M26 75 
             A17 17 0 0 1 48 59 
             A22 22 0 0 1 82 56 
             A16 16 0 0 1 96 70" 
          stroke="url(#cloudHighlight)" 
          stroke-width="3" 
          stroke-linecap="round" 
          fill="none"/>
    <path d="M34 96 L94 96" stroke="#BACFE6" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
