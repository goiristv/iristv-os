<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBody" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="82%" stop-color="#D9E6F7"/>
      <stop offset="100%" stop-color="#BACFE6"/>
    </linearGradient>
    <linearGradient id="cloudHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fogLine1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#93C5FD" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="fogLine2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="cloudShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F2444" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F2444" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Puffy Marshmallow Cloud -->
  <g filter="url(#cloudShadow)">
    <path d="M36 78 
             L92 78 
             A18 18 0 0 0 95 42.3 
             A24 24 0 0 0 54 33.5 
             A20 20 0 0 0 24 58 
             A18 18 0 0 0 36 78 Z" 
          fill="url(#cloudBody)"/>
    <path d="M26 55 
             A17 17 0 0 1 48 39 
             A22 22 0 0 1 82 36 
             A16 16 0 0 1 96 50" 
          stroke="url(#cloudHighlight)" 
          stroke-width="3" 
          stroke-linecap="round" 
          fill="none"/>
    <path d="M34 76 L94 76" stroke="#BACFE6" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Cute Floating Rounded Mist Waves -->
  <g stroke-linecap="round">
    <rect x="22" y="90" width="84" height="6" rx="3" fill="url(#fogLine1)"/>
    <rect x="32" y="102" width="64" height="6" rx="3" fill="url(#fogLine2)"/>
    <rect x="42" y="114" width="44" height="5" rx="2.5" fill="url(#fogLine1)" opacity="0.7"/>
  </g>
</svg>
