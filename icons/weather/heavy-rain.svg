<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Storm Cloud Gradients -->
    <linearGradient id="heavyCloud" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="45%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="heavyHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="heavyDrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cloudShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.38"/>
    </filter>
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Storm Cloud -->
  <g filter="url(#cloudShadow)">
    <path d="M36 82 
             L92 82 
             A18 18 0 0 0 95 46.3 
             A24 24 0 0 0 54 37.5 
             A20 20 0 0 0 24 62 
             A18 18 0 0 0 36 82 Z" 
          fill="url(#heavyCloud)"/>
    <path d="M26 59 
             A17 17 0 0 1 48 43 
             A22 22 0 0 1 82 40 
             A16 16 0 0 1 96 54" 
          stroke="url(#heavyHighlight)" 
          stroke-width="3" 
          stroke-linecap="round" 
          fill="none"/>
  </g>

  <!-- Heavy Stream of Cute Shiny Raindrops (slanted) -->
  <g filter="url(#dropShadow)" transform="rotate(-10 64 104)">
    <path d="M34 94 C34 94 28 104 28 108 C28 111.3 30.7 114 34 114 C37.3 114 40 111.3 40 108 C40 104 34 94 34 94 Z" fill="url(#heavyDrop)"/>
    <ellipse cx="32" cy="107" rx="1.5" ry="3" fill="#FFFFFF" opacity="0.8"/>

    <path d="M54 96 C54 96 48 106 48 110 C48 113.3 50.7 116 54 116 C57.3 116 60 113.3 60 110 C60 106 54 96 54 96 Z" fill="url(#heavyDrop)"/>
    <ellipse cx="52" cy="109" rx="1.5" ry="3" fill="#FFFFFF" opacity="0.8"/>

    <path d="M74 94 C74 94 68 104 68 108 C68 111.3 70.7 114 74 114 C77.3 114 80 111.3 80 108 C80 104 74 94 74 94 Z" fill="url(#heavyDrop)"/>
    <ellipse cx="72" cy="107" rx="1.5" ry="3" fill="#FFFFFF" opacity="0.8"/>

    <path d="M94 96 C94 96 88 106 88 110 C88 113.3 90.7 116 94 116 C97.3 116 100 113.3 100 110 C100 106 94 96 94 96 Z" fill="url(#heavyDrop)"/>
    <ellipse cx="92" cy="109" rx="1.5" ry="3" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
