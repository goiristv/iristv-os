<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="nightAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nightMoon" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#BFDBFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="cloudBody" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="82%" stop-color="#D9E6F7"/>
      <stop offset="100%" stop-color="#BACFE6"/>
    </linearGradient>
    <linearGradient id="cloudHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="moonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.32"/>
    </filter>
    <filter id="cloudShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F2444" flood-opacity="0.26"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F2444" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Ambient Moon Glow -->
  <circle cx="84" cy="46" r="36" fill="url(#nightAura)"/>

  <!-- Star Twinkle -->
  <path d="M104 22 L105.5 26 L110 27.5 L105.5 29 L104 33 L102.5 29 L98 27.5 L102.5 26 Z" fill="#F8FAFC" opacity="0.9"/>
  <circle cx="62" cy="22" r="2" fill="#BAE6FD" opacity="0.8"/>

  <!-- Crescent Moon Behind Cloud -->
  <g filter="url(#moonShadow)">
    <path d="M86 26 
             C70 26 57 39 57 55 
             C57 71 70 84 86 84 
             C94 84 101 81 106 75 
             C90 73 78 59 78 43 
             C78 35 81 28 86 23 
             C86 24 86 25 86 26 Z" 
          fill="url(#nightMoon)"/>
    <circle cx="68" cy="52" r="3.5" fill="#93C5FD" opacity="0.4"/>
    <path d="M85 27 C72 29 60 41 60 55 C60 67 69 78 82 82" 
          stroke="#FFFFFF" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.8"/>
  </g>

  <!-- Puffy Marshmallow Cloud in Foreground -->
  <g filter="url(#cloudShadow)">
    <path d="M36 94 
             L92 94 
             A18 18 0 0 0 95 58.3 
             A24 24 0 0 0 54 49.5 
             A20 20 0 0 0 24 74 
             A18 18 0 0 0 36 94 Z" 
          fill="url(#cloudBody)"/>
    <path d="M26 71 
             A17 17 0 0 1 48 55 
             A22 22 0 0 1 82 52 
             A16 16 0 0 1 96 66" 
          stroke="url(#cloudHighlight)" 
          stroke-width="3" 
          stroke-linecap="round" 
          fill="none"/>
    <path d="M34 92 L94 92" stroke="#BACFE6" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
