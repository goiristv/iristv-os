<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBody" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="82%" stop-color="#D9E6F7"/>
      <stop offset="100%" stop-color="#BACFE6"/>
    </linearGradient>
    <linearGradient id="cloudHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cloudShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F2444" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F2444" flood-opacity="0.16"/>
    </filter>
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Puffy Marshmallow Cloud -->
  <g filter="url(#cloudShadow)">
    <path d="M36 84 
             L92 84 
             A18 18 0 0 0 95 48.3 
             A24 24 0 0 0 54 39.5 
             A20 20 0 0 0 24 64 
             A18 18 0 0 0 36 84 Z" 
          fill="url(#cloudBody)"/>
    <path d="M26 61 
             A17 17 0 0 1 48 45 
             A22 22 0 0 1 82 42 
             A16 16 0 0 1 96 56" 
          stroke="url(#cloudHighlight)" 
          stroke-width="3" 
          stroke-linecap="round" 
          fill="none"/>
    <path d="M34 82 L94 82" stroke="#BACFE6" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Samsung Style Cute Glossy Raindrops -->
  <g filter="url(#dropShadow)">
    <!-- Drop 1 -->
    <path d="M42 96 C42 96 36 106 36 110 C36 113.3 38.7 116 42 116 C45.3 116 48 113.3 48 110 C48 106 42 96 42 96 Z" fill="url(#dropGrad)"/>
    <ellipse cx="40" cy="109" rx="1.6" ry="3" fill="#FFFFFF" opacity="0.75"/>

    <!-- Drop 2 -->
    <path d="M64 94 C64 94 58 104 58 108 C58 111.3 60.7 114 64 114 C67.3 114 70 111.3 70 108 C70 104 64 94 64 94 Z" fill="url(#dropGrad)"/>
    <ellipse cx="62" cy="107" rx="1.6" ry="3" fill="#FFFFFF" opacity="0.75"/>

    <!-- Drop 3 -->
    <path d="M86 96 C86 96 80 106 80 110 C80 113.3 82.7 116 86 116 C89.3 116 92 113.3 92 110 C92 106 86 96 86 96 Z" fill="url(#dropGrad)"/>
    <ellipse cx="84" cy="109" rx="1.6" ry="3" fill="#FFFFFF" opacity="0.75"/>
  </g>
</svg>
