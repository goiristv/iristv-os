<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBody" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="82%" stop-color="#D9E6F7"/>
      <stop offset="100%" stop-color="#BACFE6"/>
    </linearGradient>
    <linearGradient id="cloudHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="cloudShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F2444" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F2444" flood-opacity="0.16"/>
    </filter>
    <filter id="snowShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38BDF8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Puffy Marshmallow Cloud -->
  <g filter="url(#cloudShadow)">
    <path d="M36 84 
             L92 84 
             A18 18 0 0 0 95 48.3 
             A24 24 0 0 0 54 39.5 
             A20 20 0 0 0 24 64 
             A18 18 0 0 0 36 84 Z" 
          fill="url(#cloudBody)"/>
    <path d="M26 61 
             A17 17 0 0 1 48 45 
             A22 22 0 0 1 82 42 
             A16 16 0 0 1 96 56" 
          stroke="url(#cloudHighlight)" 
          stroke-width="3" 
          stroke-linecap="round" 
          fill="none"/>
    <path d="M34 82 L94 82" stroke="#BACFE6" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Cute Stylized Rounded 3D Snowflakes and Snowballs -->
  <g filter="url(#snowShadow)">
    <!-- Snowflake 1 (center) -->
    <g transform="translate(64, 104)" stroke="#7DD3FC" stroke-width="2.6" stroke-linecap="round">
      <line x1="-9" y1="0" x2="9" y2="0"/>
      <line x1="0" y1="-9" x2="0" y2="9"/>
      <line x1="-6.5" y1="-6.5" x2="6.5" y2="6.5"/>
      <line x1="-6.5" y1="6.5" x2="6.5" y2="-6.5"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" stroke="none"/>
    </g>

    <!-- Snowflake 2 (left) -->
    <g transform="translate(40, 100)" stroke="#7DD3FC" stroke-width="2.2" stroke-linecap="round">
      <line x1="-7" y1="0" x2="7" y2="0"/>
      <line x1="0" y1="-7" x2="0" y2="7"/>
      <line x1="-5" y1="-5" x2="5" y2="5"/>
      <line x1="-5" y1="5" x2="5" y2="-5"/>
      <circle cx="0" cy="0" r="2.4" fill="#FFFFFF" stroke="none"/>
    </g>

    <!-- Snowflake 3 (right) -->
    <g transform="translate(88, 100)" stroke="#7DD3FC" stroke-width="2.2" stroke-linecap="round">
      <line x1="-7" y1="0" x2="7" y2="0"/>
      <line x1="0" y1="-7" x2="0" y2="7"/>
      <line x1="-5" y1="-5" x2="5" y2="5"/>
      <line x1="-5" y1="5" x2="5" y2="-5"/>
      <circle cx="0" cy="0" r="2.4" fill="#FFFFFF" stroke="none"/>
    </g>

    <!-- Cute snow flurries / balls -->
    <circle cx="52" cy="116" r="3.2" fill="url(#snowGrad)"/>
    <circle cx="76" cy="116" r="3.2" fill="url(#snowGrad)"/>
  </g>
</svg>
