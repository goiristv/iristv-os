<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="sunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDD33" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FF9500" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunCore" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#FFF566"/>
      <stop offset="42%" stop-color="#FFAE00"/>
      <stop offset="85%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#FA4200"/>
    </linearGradient>
    <linearGradient id="sunRay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="yolkShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#E65100" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="56" fill="url(#sunAura)"/>

  <!-- Samsung Style Bubbly Pill Rays -->
  <g fill="url(#sunRay)" opacity="0.95">
    <rect x="60" y="8" width="8" height="15" rx="4" />
    <rect x="60" y="105" width="8" height="15" rx="4" />
    <rect x="8" y="60" width="15" height="8" rx="4" />
    <rect x="105" y="60" width="15" height="8" rx="4" />
    <rect x="23.5" y="23.5" width="8" height="15" rx="4" transform="rotate(-45 27.5 31)" />
    <rect x="96.5" y="96.5" width="8" height="15" rx="4" transform="rotate(-45 100.5 104)" />
    <rect x="96.5" y="23.5" width="8" height="15" rx="4" transform="rotate(45 100.5 31)" />
    <rect x="23.5" y="96.5" width="8" height="15" rx="4" transform="rotate(45 27.5 104)" />
  </g>

  <!-- 3D Juicy Yolk Sphere -->
  <circle cx="64" cy="64" r="36" fill="url(#sunCore)" filter="url(#yolkShadow)"/>

  <!-- Juicy Egg/Gloss Reflection -->
  <ellipse cx="53" cy="49" rx="13" ry="8" transform="rotate(-28 53 49)" fill="#FFFFFF" opacity="0.58"/>
  <ellipse cx="73" cy="79" rx="14" ry="4" transform="rotate(-15 73 79)" fill="#FF8000" opacity="0.45"/>
</svg>
