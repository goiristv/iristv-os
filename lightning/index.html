<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>irisTV — Lightning Engine (60 FPS WebGL)</title>
  <link rel="icon" type="image/svg+xml" href="../logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face { font-family: 'PlusJakartaSans'; src: url('/public/fonts/PlusJakartaSans.ttf') format('truetype'); font-weight: 100 900; }
    @font-face { font-family: 'Plus Jakarta Sans'; src: url('/public/fonts/PlusJakartaSans.ttf') format('truetype'); font-weight: 100 900; }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b13;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    #tv-video-native {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000000;
      z-index: 0;
      display: none;
    }
    #lightning-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
    }

    /* Boot Screen - 3s Cinematic Hardware-Accelerated Startup */
    .boot-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #0f152a 0%, #05070f 75%);
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
      contain: strict;
    }
    .boot-screen.fade-out {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }
    .boot-glow {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.28) 0%, rgba(124, 77, 255, 0.18) 42%, rgba(255, 45, 111, 0.08) 65%, transparent 75%);
      pointer-events: none;
      animation: bootGlowPulse 3s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate;
      will-change: transform, opacity;
    }
    @keyframes bootGlowPulse {
      0% { transform: scale(0.85); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.9; }
      100% { transform: scale(1.0); opacity: 0.75; }
    }
    .boot-logo-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      will-change: transform, opacity;
      animation: bootLogoEnter 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes bootLogoEnter {
      0% { opacity: 0; transform: translate3d(0, 24px, 0) scale(0.86); }
      100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    .boot-svg {
      width: 160px;
      height: 160px;
      overflow: visible;
      filter: drop-shadow(0 0 26px rgba(0, 229, 255, 0.35));
    }
    .iris-prism-ring {
      transform-origin: 100px 100px;
      animation: irisRingSpin 3s cubic-bezier(0.16, 1, 0.3, 1) both;
      will-change: transform;
    }
    @keyframes irisRingSpin {
      0% { transform: rotate(-120deg) scale(0.65); opacity: 0; }
      20% { opacity: 1; }
      70% { transform: rotate(18deg) scale(1.04); }
      100% { transform: rotate(0deg) scale(1); opacity: 1; }
    }
    .iris-petal {
      transform-origin: 100px 100px;
      animation: irisPetalBloom 1.3s cubic-bezier(0.16, 1, 0.3, 1) both;
      will-change: transform, opacity;
    }
    @keyframes irisPetalBloom {
      0% { opacity: 0; transform: scale(0.2); }
      60% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 1; transform: scale(1); }
    }
    .iris-petal.ip-1  { animation-delay: 0.04s; }
    .iris-petal.ip-2  { animation-delay: 0.08s; }
    .iris-petal.ip-3  { animation-delay: 0.12s; }
    .iris-petal.ip-4  { animation-delay: 0.16s; }
    .iris-petal.ip-5  { animation-delay: 0.20s; }
    .iris-petal.ip-6  { animation-delay: 0.24s; }
    .iris-petal.ip-7  { animation-delay: 0.28s; }
    .iris-petal.ip-8  { animation-delay: 0.32s; }
    .iris-petal.ip-9  { animation-delay: 0.36s; }
    .iris-petal.ip-10 { animation-delay: 0.40s; }
    .iris-petal.ip-11 { animation-delay: 0.44s; }
    .iris-petal.ip-12 { animation-delay: 0.48s; }
    .iris-ring-outer {
      animation: irisRingPulse 3s ease-in-out infinite alternate;
    }
    @keyframes irisRingPulse {
      0% { stroke: rgba(255, 255, 255, 0.25); }
      50% { stroke: rgba(0, 229, 255, 0.65); }
      100% { stroke: rgba(255, 255, 255, 0.35); }
    }
    .boot-wordmark {
      margin-top: 16px;
      font-family: 'PlusJakartaSans', 'Plus Jakarta Sans', sans-serif;
      font-size: 2.9rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      animation: bootTextIn 1.1s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes bootTextIn {
      0% { opacity: 0; transform: translate3d(0, 12px, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    .brand-iris { color: #ffffff; font-weight: 700; }
    .brand-os {
      background: linear-gradient(135deg, #00e5ff 0%, #7c4dff 50%, #ff2d6f 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 800;
    }
    .boot-progress-track {
      width: 240px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      margin-top: 26px;
      overflow: hidden;
      box-shadow: 0 0 14px rgba(0, 0, 0, 0.4);
    }
    .boot-progress-fill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #00e5ff 0%, #7c4dff 50%, #ff2d6f 100%);
      transform-origin: left center;
      transform: scaleX(0);
      animation: bootBarFill 3.0s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: transform;
    }
    @keyframes bootBarFill {
      0% { transform: scaleX(0.04); }
      25% { transform: scaleX(0.28); }
      65% { transform: scaleX(0.72); }
      90% { transform: scaleX(0.96); }
      100% { transform: scaleX(1); }
    }
    .skip-boot-btn {
      position: absolute;
      bottom: 32px;
      right: 40px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.65);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .skip-boot-btn:hover,
    .skip-boot-btn:focus-visible {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.45);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <video id="tv-video-native" playsinline></video>
  <canvas id="lightning-canvas" width="1920" height="1080"></canvas>

  <!-- Boot / Startup Sequence Overlay -->
  <div id="boot-screen" class="boot-screen" role="status" aria-label="Inicializando">
    <div class="boot-glow"></div>
    <div class="boot-logo-wrap">
      <svg class="iris-prism-svg boot-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="boot-pupil-grad" cx="38%" cy="32%" r="68%">
            <stop offset="0%" stop-color="#222845" />
            <stop offset="55%" stop-color="#0a0c16" />
            <stop offset="100%" stop-color="#020307" />
          </radialGradient>
          <linearGradient id="ip-c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFE600"/><stop offset="100%" stop-color="#FF9900"/></linearGradient>
          <linearGradient id="ip-c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF8800"/><stop offset="100%" stop-color="#FF3B30"/></linearGradient>
          <linearGradient id="ip-c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF2D6F"/><stop offset="100%" stop-color="#D9006C"/></linearGradient>
          <linearGradient id="ip-c4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E040FB"/><stop offset="100%" stop-color="#8A2BE2"/></linearGradient>
          <linearGradient id="ip-c5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7C4DFF"/><stop offset="100%" stop-color="#3D5AFE"/></linearGradient>
          <linearGradient id="ip-c6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00B0FF"/><stop offset="100%" stop-color="#00E5FF"/></linearGradient>
          <linearGradient id="ip-c7" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00E5A3"/><stop offset="100%" stop-color="#00C853"/></linearGradient>
          <linearGradient id="ip-c8" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#AEEA00"/><stop offset="100%" stop-color="#FFD600"/></linearGradient>
        </defs>
        <g class="iris-prism-ring">
          <g transform="rotate(0 100 100)"><ellipse class="iris-petal ip-1" cx="100" cy="40" rx="18" ry="34" fill="url(#ip-c3)" /></g>
          <g transform="rotate(30 100 100)"><ellipse class="iris-petal ip-2" cx="100" cy="40" rx="18" ry="34" fill="url(#ip-c4)" /></g>
          <g transform="rotate(60 100 100)"><ellipse class="iris-petal ip-3" cx="100" cy="40" rx="18" ry="34" fill="url(#ip-c5)" /></g>
          <g transform="rotate(90 100 100)"><ellipse class="iris-petal ip-4" cx="100" cy="40" rx="18" ry="34" fill="url(#ip-c6)" /></g>
          <g transform="rotate(120 100 100)"><ellipse class="iris-petal ip-5" cx="100" cy="40" rx="18" ry="34" fill="url(#ip-c6)" /></g>
          <g transform="rotate(150 100 100)"><ellipse class="iris-petal ip-6" cx="100" cy="40" rx="18" ry="34" fill="url(#ip-c7)" /></g>
          <g transform="rotate(180 100 100)"><ellipse class="iris-petal ip-7" cx="100" cy="40" rx="18" ry="34" fill="url(#ip-c7)" /></g>
          <g transform="rotate(210 100 100)"><ellipse class="iris-petal ip-8" cx="100" cy="40" rx="18" ry="34" fill="url(#ip-c8)" /></g>
          <g transform="rotate(240 100 100)"><ellipse class="iris-petal ip-9" cx="100" cy="40" rx="18" ry="34" fill="url(#ip-c1)" /></g>
          <g transform="rotate(270 100 100)"><ellipse class="iris-petal ip-10" cx="100" cy="40" rx="18" ry="34" fill="url(#ip-c2)" /></g>
          <g transform="rotate(300 100 100)"><ellipse class="iris-petal ip-11" cx="100" cy="40" rx="18" ry="34" fill="url(#ip-c2)" /></g>
          <g transform="rotate(330 100 100)"><ellipse class="iris-petal ip-12" cx="100" cy="40" rx="18" ry="34" fill="url(#ip-c3)" /></g>
        </g>
        <circle class="iris-ring-outer" cx="100" cy="100" r="46" fill="#070912" stroke="rgba(255,255,255,0.28)" stroke-width="2" />
        <circle class="iris-ring-inner" cx="100" cy="100" r="36" fill="url(#boot-pupil-grad)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />
        <circle cx="100" cy="100" r="18" fill="#030409" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
        <circle cx="88" cy="87" r="7" fill="#ffffff" opacity="0.88" />
        <circle cx="112" cy="112" r="3" fill="#00E5FF" opacity="0.72" />
      </svg>
      <div class="boot-wordmark">
        <span class="brand-iris">iris</span><span class="brand-os">TV</span>
      </div>
      <div class="boot-progress-track" aria-hidden="true">
        <div class="boot-progress-fill"></div>
      </div>
    </div>
    <button id="skip-boot-btn" class="skip-boot-btn" type="button">Pular</button>
  </div>

  <!-- Core & Platform Bridges -->
  <script src="../webos/polyfills.js"></script>
  <script src="../vendor/lightning.es5.min.js"></script>
  <script src="../webos/webos-bridge.js"></script>

  <!-- Data Catalog -->
  <script src="data/catalog.js"></script>

  <!-- Reusable Components -->
  <script src="components/VirtualKeyboard.js"></script>
  <script src="components/VideoPlayer.js"></script>

  <!-- Feature Views -->
  <script src="views/DetailsView.js"></script>
  <script src="views/NewsView.js"></script>
  <script src="views/VaultView.js"></script>
  <script src="views/DvrView.js"></script>
  <script src="views/LiveTvView.js"></script>
  <script src="views/MediaView.js"></script>
  <script src="views/SettingsView.js"></script>
  <script src="views/OnboardingView.js"></script>
  <script src="views/HomeView.js"></script>

  <!-- Master Application & Router -->
  <script src="app.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var canvas = document.getElementById('lightning-canvas');
      function go() { if (window.launchIrisLightning) window.launchIrisLightning(canvas); }
      if (document.fonts && document.fonts.load) {
        Promise.all([document.fonts.load('20px PlusJakartaSans'), document.fonts.load('bold 20px PlusJakartaSans')]).then(go, go);
      } else { go(); }

      // Boot Screen 3-Second Cinematic Hardware-Accelerated Sequence
      var bs = document.getElementById('boot-screen');
      var dismissed = false;
      function dismissBoot() {
        if (dismissed || !bs) return;
        dismissed = true;
        bs.classList.add('fade-out');
        setTimeout(function () {
          if (bs && bs.parentNode) bs.parentNode.removeChild(bs);
        }, 600);
      }
      setTimeout(dismissBoot, 3000);
      var skipBtn = document.getElementById('skip-boot-btn');
      if (skipBtn) skipBtn.addEventListener('click', dismissBoot);
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === 'Escape' || e.key === ' ') dismissBoot();
      });
    });
  </script>
</body>
</html>
