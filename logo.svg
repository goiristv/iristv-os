<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="irisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#9B4DFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pupilGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#222845"/>
      <stop offset="55%" stop-color="#0a0c16"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFE600"/><stop offset="100%" stop-color="#FF9900"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF8800"/><stop offset="100%" stop-color="#FF3B30"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF2D6F"/><stop offset="100%" stop-color="#D9006C"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E040FB"/><stop offset="100%" stop-color="#8A2BE2"/></linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7C4DFF"/><stop offset="100%" stop-color="#3D5AFE"/></linearGradient>
    <linearGradient id="c6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00B0FF"/><stop offset="100%" stop-color="#00E5FF"/></linearGradient>
    <linearGradient id="c7" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00E5A3"/><stop offset="100%" stop-color="#00C853"/></linearGradient>
    <linearGradient id="c8" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#AEEA00"/><stop offset="100%" stop-color="#FFD600"/></linearGradient>
  </defs>

  <!-- Soft outer aura -->
  <circle cx="100" cy="100" r="96" fill="url(#irisGlow)"/>

  <!-- 12 Multicolor Chromatic Iris Petals arranged in a full 360° prism -->
  <g opacity="0.95">
    <ellipse cx="100" cy="40" rx="18" ry="34" fill="url(#c3)" transform="rotate(0 100 100)"/>
    <ellipse cx="100" cy="40" rx="18" ry="34" fill="url(#c4)" transform="rotate(30 100 100)"/>
    <ellipse cx="100" cy="40" rx="18" ry="34" fill="url(#c5)" transform="rotate(60 100 100)"/>
    <ellipse cx="100" cy="40" rx="18" ry="34" fill="url(#c6)" transform="rotate(90 100 100)"/>
    <ellipse cx="100" cy="40" rx="18" ry="34" fill="url(#c6)" transform="rotate(120 100 100)"/>
    <ellipse cx="100" cy="40" rx="18" ry="34" fill="url(#c7)" transform="rotate(150 100 100)"/>
    <ellipse cx="100" cy="40" rx="18" ry="34" fill="url(#c7)" transform="rotate(180 100 100)"/>
    <ellipse cx="100" cy="40" rx="18" ry="34" fill="url(#c8)" transform="rotate(210 100 100)"/>
    <ellipse cx="100" cy="40" rx="18" ry="34" fill="url(#c1)" transform="rotate(240 100 100)"/>
    <ellipse cx="100" cy="40" rx="18" ry="34" fill="url(#c2)" transform="rotate(270 100 100)"/>
    <ellipse cx="100" cy="40" rx="18" ry="34" fill="url(#c2)" transform="rotate(300 100 100)"/>
    <ellipse cx="100" cy="40" rx="18" ry="34" fill="url(#c3)" transform="rotate(330 100 100)"/>
  </g>

  <!-- Inner vibrant prism ring -->
  <circle cx="100" cy="100" r="46" fill="#070912" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>

  <!-- Optical Iris Pupil & Glass Reflection -->
  <circle cx="100" cy="100" r="36" fill="url(#pupilGrad)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="18" fill="#030409" stroke="rgba(255,255,255,0.38)" stroke-width="1"/>
  <circle cx="88" cy="87" r="7" fill="#ffffff" opacity="0.88"/>
  <circle cx="112" cy="112" r="3" fill="#00E5FF" opacity="0.7"/>
</svg>

